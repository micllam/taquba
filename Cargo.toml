[workspace]
members = [
    "taquba",
    "taquba-cron",
    "taquba-webhooks",
    "taquba-workflow",
    "taquba-bencher",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/micllam/taquba"

[workspace.lints.clippy]
mod_module_files = "warn"
return_self_not_must_use = "warn"

[workspace.dependencies]
taquba = { path = "taquba", version = "0.17.0" }
taquba-webhooks = { path = "taquba-webhooks", version = "0.13.0" }
taquba-workflow = { path = "taquba-workflow", version = "0.16.0" }

tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "1"
ulid = "1"
url = "2"
