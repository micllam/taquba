name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Supersede an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info increases target directory size and link time; no job here
  # reads a symbolised backtrace.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Separate from `test` so lint and test failures are reported in the same run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - run: cargo test --workspace --all-features --locked

  # `--all-features` of `lint` and `test` enables every feature at once. This
  # job checks each crate without its default features and with each feature
  # alone.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: features
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --exclude taquba-bencher --each-feature --locked

  minio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      minio:
        # The official minio image requires a `server /data` command, which
        # service containers cannot supply. The Bitnami build starts from
        # environment variables and pre-creates the bucket. bitnamilegacy is
        # frozen, so the digest is pinned.
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: taquba
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
      # Exercises enqueue, the claim scan, settlement and the durable commit
      # path against a real S3 API. Timings from a shared runner are not
      # comparable with the recorded benchmark results and are not retained.
      - name: claim_drain against MinIO
        env:
          STORE_URL: s3://taquba/
          STORE_PREFIX: ci-${{ github.run_id }}
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_ALLOW_HTTP: "true"
          N_JOBS: "2000"
          N_WORKERS: "16"
        run: cargo bench -p taquba-bencher --features aws --bench claim_drain --locked
