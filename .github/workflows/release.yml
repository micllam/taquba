name: Release

# Publishes each crate version that is not already on crates.io, in dependency
# order, then creates its `<crate>-v<version>` tag and a GitHub release with the
# notes of its CHANGELOG.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.ref == 'refs/heads/master'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      # crates.io trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
