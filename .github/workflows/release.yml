name: Release

# Publishes each crate version that is not already on crates.io, in dependency
# order, then creates its `<crate>-v<version>` tag and a GitHub release with the
# notes of its CHANGELOG.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.ref == 'refs/heads/master'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      # crates.io trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
