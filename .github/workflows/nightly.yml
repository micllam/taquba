name: Nightly

# Limited to jobs that run unbounded or whose input changes without a push.
# Bounded jobs that read only the repository run per push in ci.yml.
on:
  schedule:
    # 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes to loop the test suite for"
        required: false
        default: ""
      soak_schedule:
        description: "RATE_SCHEDULE for every soak arm (comma-separated seconds:rate)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # The suite uses MockClock, `start_paused` virtual time, lease expiry,
  # reaper and scheduler intervals and spawned tasks. Intermittent failures in
  # those paths can be absent from any single run, so the suite is repeated.
  flaky-tests:
    runs-on: ubuntu-latest
    # Above the step timeout below. A failed step sends a notification; a
    # job-level timeout cancels the run, and GitHub does not notify on
    # cancellations.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Loop the test suite
        timeout-minutes: 45
        env:
          LOOP_MINUTES: ${{ inputs.loop_minutes || '15' }}
        run: |
          set -euo pipefail
          # Build once so the loop measures test execution, not compilation.
          cargo test --workspace --all-features --locked --no-run
          SECONDS=0
          deadline=$((LOOP_MINUTES * 60))
          iteration=1
          while [ $SECONDS -lt $deadline ]; do
            echo "=== iteration $iteration (elapsed ${SECONDS}s) ==="
            if ! cargo test --workspace --all-features --locked; then
              echo "suite failed on iteration $iteration" >&2
              exit 1
            fi
            iteration=$((iteration + 1))
          done
          echo "completed $((iteration - 1)) iteration(s) in ${SECONDS}s with no failures"

  # Measures whether the queue remains leak-free and error-free under changing
  # load, and whether backlog builds and drains. Real object storage is
  # required only for recorded measurements, so this runs against the
  # throttled in-memory store.
  #
  # Fails on a panic, an error return or exhausted memory, and on a completion
  # rate, end-to-end latency or claim latency outside the arm's bounds in the
  # closing windows. Degradation that stays within them, such as a slowly
  # rising backlog, still requires reading the CSV artifact.
  soak:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are limited to six hours; longer runs stay manual.
    timeout-minutes: 90
    strategy:
      # Each arm reports its own result.
      fail-fast: false
      matrix:
        # `min_done` is the rate the arm's closing schedule segment offers,
        # less a margin for runner variation. Each arm sets it because the
        # closing segments differ.
        include:
          # Offered load within worker capacity throughout.
          - arm: varying
            schedule: 120:0,900:150,600:400,300:800,600:150
            producers: 8
            workers: 32
            queues: 1
            min_done: 120
          # Offered load above worker capacity, so the burst builds a
          # backlog and the recovery segment drains it. Producers enqueue
          # serially, so exceeding that capacity takes more of them. The
          # recovery segment is long enough that the backlog clears well
          # before the closing windows.
          - arm: backlog
            schedule: 60:0,300:150,300:1000,600:150
            producers: 32
            workers: 32
            queues: 1
            min_done: 120
          # Exercises the global reaper and scheduler prefix scans and the
          # per-queue claim state.
          - arm: sharded
            schedule: 120:0,600:150,300:600,300:150
            producers: 16
            workers: 32
            queues: 4
            min_done: 120
          # Claims one job per call at a rate a single queue sustains,
          # and runs long enough to cross the compaction that first
          # leaves the claim scan a sorted run to consult. The other
          # arms batch, which amortizes per-claim scan cost across the
          # batch and would mask a regression in it. This arm sustains
          # its rate only while an unbatched claim is served from cache.
          - arm: unbatched
            schedule: 60:0,1500:100
            producers: 8
            workers: 32
            queues: 1
            claim_batch: 1
            # One claim per call, so the sustainable rate is well below
            # the batched arms' and varies with the runner.
            min_done: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - name: Soak (${{ matrix.arm }}) against the throttled in-memory store
        timeout-minutes: 80
        env:
          # 20ms per object-store call approximates an S3-class backend.
          STORE_LATENCY_MS: "20"
          RATE_SCHEDULE: ${{ inputs.soak_schedule || matrix.schedule }}
          # Claims serialise per queue and the lock is held across the
          # scan, so a queue's claim rate rises with the batch size
          # rather than with worker count. `run_worker_concurrent`
          # batches for the same reason. The unbatched arm overrides
          # this so the one-claim-per-call path remains measured.
          CLAIM_BATCH: ${{ matrix.claim_batch || '16' }}
          # Otherwise an undrainable backlog runs to the step timeout, which
          # leaves no CSV.
          DRAIN_TIMEOUT_SEC: "600"
          # A realistic flush interval rather than the 1ms isolation setting.
          FLUSH_INTERVAL_MS: "20"
          N_WORKERS: ${{ matrix.workers }}
          N_PRODUCERS: ${{ matrix.producers }}
          N_QUEUES: ${{ matrix.queues }}
        # stdout is the CSV, stderr the per-second progress; both are kept.
        run: |
          set -o pipefail
          cargo bench -p taquba-bencher --bench steady_state --locked \
            2>&1 1>soak.csv | tee soak.log
      # A fall in throughput or a rise in latency does not change the exit
      # code: the queue continues to accept and complete work, and the only
      # record is the CSV artifact. Every arm's schedule ends at a rate its
      # workers sustain, so the closing windows are its steady state and are
      # compared against the arm's bounds. The two latency bounds detect a
      # regression that leaves throughput intact, which the completion rate
      # alone does not; they are set an order of magnitude above the
      # sustained figures rather than derived from them, so they detect a
      # large regression rather than a small one. Measured latencies are
      # recorded in taquba-bencher/RESULTS.md.
      - name: Assert the closing windows stayed within the arm's bounds
        if: always()
        env:
          MIN_DONE: ${{ matrix.min_done }}
          MAX_E2E_P99_MS: ${{ matrix.max_e2e_p99_ms || '5000' }}
          MAX_CLAIM_P99_MS: ${{ matrix.max_claim_p99_ms || '250' }}
        run: |
          set -euo pipefail
          # An unset bound would compare as a string in awk and pass silently.
          : "${MIN_DONE:?every soak arm must set min_done}"
          awk -F, \
            -v min_done="$MIN_DONE" \
            -v max_e2e_us=$((MAX_E2E_P99_MS * 1000)) \
            -v max_claim_us=$((MAX_CLAIM_P99_MS * 1000)) '
            NR > 1 && $4 ~ /^[0-9]+$/ {
              done[n] = $4; e2e[n] = $7; claim[n] = $8; n++
            }
            END {
              window = 120
              if (n < window) {
                printf "only %d windows recorded, expected at least %d\n", n, window > "/dev/stderr"
                exit 1
              }
              for (i = n - window; i < n; i++) {
                sum_done += done[i]; sum_e2e += e2e[i]; sum_claim += claim[i]
              }
              mean_done = sum_done / window
              mean_e2e = sum_e2e / window / 1000
              mean_claim = sum_claim / window / 1000
              printf "means over the last %d windows: %.1f completions/s (at least %.1f), e2e p99 %.1f ms (at most %.1f), claim p99 %.1f ms (at most %.1f)\n", \
                window, mean_done, min_done, mean_e2e, max_e2e_us / 1000, mean_claim, max_claim_us / 1000
              failed = 0
              if (mean_done < min_done) {
                print "completion rate fell below the lower bound" > "/dev/stderr"
                failed = 1
              }
              if (sum_e2e / window > max_e2e_us) {
                print "end-to-end p99 rose above the upper bound" > "/dev/stderr"
                failed = 1
              }
              if (sum_claim / window > max_claim_us) {
                print "claim p99 rose above the upper bound" > "/dev/stderr"
                failed = 1
              }
              if (failed) print "see the CSV artifact" > "/dev/stderr"
              exit failed
            }' soak.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-csv-${{ matrix.arm }}-${{ github.run_id }}
          path: |
            soak.csv
            soak.log
          retention-days: 14
          if-no-files-found: error

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # A prebuilt binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Vulnerabilities fail the job. Unmaintained and unsound crates are
      # reported without failing it.
      - run: cargo audit
