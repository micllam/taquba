name: Nightly

# Limited to jobs that run unbounded or whose input changes without a push.
# Bounded jobs that read only the repository run per push in ci.yml.
on:
  schedule:
    # 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes to loop the test suite for"
        required: false
        default: ""
      soak_schedule:
        description: "RATE_SCHEDULE for every soak arm (comma-separated seconds:rate)"
        required: false
        default: ""

# No job here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # The suite uses MockClock, `start_paused` virtual time, lease expiry,
  # reaper and scheduler intervals and spawned tasks. Intermittent failures in
  # those paths can be absent from any single run, so the suite is repeated.
  flaky-tests:
    runs-on: ubuntu-latest
    # Above the step timeout below. A failed step sends a notification; a
    # job-level timeout cancels the run, and GitHub does not notify on
    # cancellations.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Loop the test suite
        timeout-minutes: 45
        env:
          LOOP_MINUTES: ${{ inputs.loop_minutes || '15' }}
        run: |
          set -euo pipefail
          # Build once so the loop measures test execution, not compilation.
          cargo test --workspace --all-features --locked --no-run
          SECONDS=0
          deadline=$((LOOP_MINUTES * 60))
          iteration=1
          while [ $SECONDS -lt $deadline ]; do
            echo "=== iteration $iteration (elapsed ${SECONDS}s) ==="
            if ! cargo test --workspace --all-features --locked; then
              echo "suite failed on iteration $iteration" >&2
              exit 1
            fi
            iteration=$((iteration + 1))
          done
          echo "completed $((iteration - 1)) iteration(s) in ${SECONDS}s with no failures"

  # Measures whether the queue remains leak-free and error-free under changing
  # load. Real object storage is required only for recorded measurements, so
  # this runs against the throttled in-memory store.
  #
  # Fails on a panic, an error returned by any producer or worker, exhausted
  # memory, a queue that does not drain and a completion rate below the arm's
  # bound. Latency is recorded in the CSV artifact and is not asserted on.
  soak:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are limited to six hours; longer runs stay manual.
    timeout-minutes: 90
    env:
      # Read by the bench and by the derived bound.
      RATE_SCHEDULE: ${{ inputs.soak_schedule || matrix.schedule }}
    strategy:
      # Each arm reports its own result.
      fail-fast: false
      matrix:
        include:
          # Offered load within worker capacity throughout. Producers
          # enqueue serially and one sustains roughly 40/s, so the count
          # follows the highest segment rate.
          - arm: varying
            schedule: 120:0,900:150,600:400,300:800,600:150
            producers: 32
            workers: 32
            queues: 1
          # Exercises the global reaper and scheduler prefix scans and the
          # per-queue claim state.
          - arm: sharded
            schedule: 120:0,600:150,300:600,300:150
            producers: 16
            workers: 32
            queues: 4
          # Claims one job per call at a rate a single queue sustains,
          # and runs long enough to cross the compaction that first
          # leaves the claim scan a sorted run to consult. The other
          # arms batch, which amortizes per-claim scan cost across the
          # batch and would mask a regression in it. This arm sustains
          # its rate only while an unbatched claim is served from cache.
          - arm: unbatched
            schedule: 60:0,1500:100
            producers: 8
            workers: 32
            queues: 1
            claim_batch: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - name: Soak (${{ matrix.arm }}) against the throttled in-memory store
        timeout-minutes: 80
        env:
          # 20ms per object-store call approximates an S3-class backend.
          STORE_LATENCY_MS: "20"
          # Claims serialise per queue and the lock is held across the
          # scan, so a queue's claim rate rises with the batch size
          # rather than with worker count. `run_worker_concurrent`
          # batches for the same reason. The unbatched arm overrides
          # this so the one-claim-per-call path remains measured.
          CLAIM_BATCH: ${{ matrix.claim_batch || '16' }}
          # Otherwise an undrainable backlog runs to the step timeout, which
          # leaves no CSV.
          DRAIN_TIMEOUT_SEC: "600"
          # A realistic flush interval rather than the 1ms isolation setting.
          FLUSH_INTERVAL_MS: "20"
          N_WORKERS: ${{ matrix.workers }}
          N_PRODUCERS: ${{ matrix.producers }}
          N_QUEUES: ${{ matrix.queues }}
        # stdout is the CSV, stderr the per-second progress; both are kept.
        run: |
          set -o pipefail
          cargo bench -p taquba-bencher --bench steady_state --locked \
            2>&1 1>soak.csv | tee soak.log
      # A fall in throughput does not change the bench's exit code: the queue
      # continues to accept and complete work, and the only record is the CSV
      # artifact. Every arm's schedule ends at a rate its workers sustain, so
      # the closing windows are its steady state and are compared against a
      # bound derived from that rate.
      - name: Assert the closing completion rate stayed above the arm's bound
        if: always()
        run: |
          set -euo pipefail
          # The closing segment's rate, less 20% for runner variation. A
          # rate of 0 would derive a bound that always passes.
          closing_rate=${RATE_SCHEDULE##*:}
          [ "$closing_rate" -gt 0 ] || { echo "the closing segment must offer a non-zero rate" >&2; exit 1; }
          min_done=$((closing_rate * 80 / 100))
          awk -F, -v min_done="$min_done" '
            NR > 1 && $4 ~ /^[0-9]+$/ { done[n] = $4; n++ }
            END {
              window = 120
              # The schedule ends on a partial second and the drain records
              # a further window, both below the offered rate.
              tail = 2
              if (n < window + tail) {
                printf "only %d windows recorded, expected at least %d\n", n, window + tail > "/dev/stderr"
                exit 1
              }
              for (i = n - window - tail; i < n - tail; i++) {
                sum_done += done[i]
              }
              mean_done = sum_done / window
              printf "mean over the %d windows preceding the drain: %.1f completions/s (at least %.1f)\n", \
                window, mean_done, min_done
              if (mean_done < min_done) {
                print "completion rate fell below the lower bound, see the CSV artifact" > "/dev/stderr"
                exit 1
              }
            }' soak.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-csv-${{ matrix.arm }}-${{ github.run_id }}
          path: |
            soak.csv
            soak.log
          retention-days: 14
          if-no-files-found: error

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # A prebuilt binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Vulnerabilities fail the job. Unmaintained and unsound crates are
      # reported without failing it.
      - run: cargo audit

  # Tests the resolution a consumer gets, since no lockfile is published.
  unlocked-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve every dependency to its newest compatible version
        run: cargo update
      - run: cargo test --workspace --all-features
