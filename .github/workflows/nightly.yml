name: Nightly

# Limited to jobs that are unbounded by construction: one runs until a clock
# expires, the other runs for hours. Bounded jobs run per push in ci.yml.
on:
  schedule:
    # 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes to loop the test suite for"
        required: false
        default: ""
      soak_schedule:
        description: "RATE_SCHEDULE for every soak arm (comma-separated seconds:rate)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # The suite uses MockClock, `start_paused` virtual time, lease expiry,
  # reaper and scheduler intervals and spawned tasks. Intermittent failures in
  # those paths can be absent from any single run, so the suite is repeated.
  flaky-tests:
    runs-on: ubuntu-latest
    # Above the step timeout below. A failed step sends a notification; a
    # job-level timeout cancels the run, and GitHub does not notify on
    # cancellations.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Loop the test suite
        timeout-minutes: 45
        env:
          LOOP_MINUTES: ${{ inputs.loop_minutes || '15' }}
        run: |
          set -euo pipefail
          # Build once so the loop measures test execution, not compilation.
          cargo test --workspace --all-features --locked --no-run
          SECONDS=0
          deadline=$((LOOP_MINUTES * 60))
          iteration=1
          while [ $SECONDS -lt $deadline ]; do
            echo "=== iteration $iteration (elapsed ${SECONDS}s) ==="
            if ! cargo test --workspace --all-features --locked; then
              echo "suite failed on iteration $iteration" >&2
              exit 1
            fi
            iteration=$((iteration + 1))
          done
          echo "completed $((iteration - 1)) iteration(s) in ${SECONDS}s with no failures"

  # Measures whether the queue remains leak-free and error-free under changing
  # load, and whether backlog builds and drains. Real object storage is
  # required only for recorded measurements, so this runs against the
  # throttled in-memory store.
  #
  # Fails on a panic, an error return, exhausted memory or a completion rate
  # in the closing windows below the arm's lower bound. Gradual degradation
  # that does not reach that bound, such as a slowly rising backlog or
  # increasing latency, still requires reading the CSV artifact.
  soak:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are limited to six hours; longer runs stay manual.
    timeout-minutes: 90
    strategy:
      # Each arm reports its own result.
      fail-fast: false
      matrix:
        include:
          # Offered load within worker capacity throughout.
          - arm: varying
            schedule: 120:0,900:150,600:400,300:800,600:150
            producers: 8
            workers: 32
            queues: 1
          # Offered load above worker capacity, so the burst builds a
          # backlog and the recovery segment drains it. Producers enqueue
          # serially, so exceeding that capacity takes more of them.
          - arm: backlog
            schedule: 60:0,300:150,300:1000,600:150
            producers: 32
            workers: 32
            queues: 1
          # Exercises the global reaper and scheduler prefix scans and the
          # per-queue claim state.
          - arm: sharded
            schedule: 120:0,600:150,300:600,300:150
            producers: 16
            workers: 32
            queues: 4
          # Claims one job per call at a rate a single queue sustains,
          # and runs long enough to cross the compaction that first
          # leaves the claim scan a sorted run to consult. The other
          # arms batch, which amortizes per-claim scan cost across the
          # batch and would mask a regression in it. This arm sustains
          # its rate only while an unbatched claim is served from cache.
          - arm: unbatched
            schedule: 60:0,1500:100
            producers: 8
            workers: 32
            queues: 1
            claim_batch: 1
            # One claim per call, so the sustainable rate is well below
            # the batched arms' and varies with the runner.
            min_done: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - name: Soak (${{ matrix.arm }}) against the throttled in-memory store
        timeout-minutes: 80
        env:
          # 20ms per object-store call approximates an S3-class backend.
          STORE_LATENCY_MS: "20"
          RATE_SCHEDULE: ${{ inputs.soak_schedule || matrix.schedule }}
          # Claims serialise per queue and the lock is held across the
          # scan, so a queue's claim rate rises with the batch size
          # rather than with worker count. `run_worker_concurrent`
          # batches for the same reason. The unbatched arm overrides
          # this so the one-claim-per-call path remains measured.
          CLAIM_BATCH: ${{ matrix.claim_batch || '16' }}
          # Otherwise an undrainable backlog runs to the step timeout, which
          # leaves no CSV.
          DRAIN_TIMEOUT_SEC: "600"
          # A realistic flush interval rather than the 1ms isolation setting.
          FLUSH_INTERVAL_MS: "20"
          N_WORKERS: ${{ matrix.workers }}
          N_PRODUCERS: ${{ matrix.producers }}
          N_QUEUES: ${{ matrix.queues }}
        # stdout is the CSV, stderr the per-second progress; both are kept.
        run: |
          set -o pipefail
          cargo bench -p taquba-bencher --bench steady_state --locked \
            2>&1 1>soak.csv | tee soak.log
      # A mid-run fall in throughput does not change the exit code: the
      # queue continues to accept and complete work, at a rate far below
      # the one offered, and the only record is the CSV artifact. Every
      # arm's schedule ends at a rate its workers sustain, so a mean
      # materially below that lower bound over the closing windows
      # indicates the queue no longer sustains the offered load.
      - name: Assert the closing windows sustained their offered rate
        if: always()
        env:
          MIN_DONE: ${{ matrix.min_done || '100' }}
        run: |
          set -euo pipefail
          awk -F, -v floor="$MIN_DONE" '
            NR > 1 && $4 ~ /^[0-9]+$/ { done[n++] = $4 }
            END {
              window = 120
              if (n < window) {
                printf "only %d windows recorded, expected at least %d\n", n, window > "/dev/stderr"
                exit 1
              }
              for (i = n - window; i < n; i++) total += done[i]
              mean = total / window
              printf "mean completions over the last %d windows: %.1f/s (lower bound %.1f)\n", window, mean, floor
              if (mean < floor) {
                print "claim throughput fell below the lower bound: see the CSV artifact" > "/dev/stderr"
                exit 1
              }
            }' soak.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-csv-${{ matrix.arm }}-${{ github.run_id }}
          path: |
            soak.csv
            soak.log
          retention-days: 14
          if-no-files-found: error
